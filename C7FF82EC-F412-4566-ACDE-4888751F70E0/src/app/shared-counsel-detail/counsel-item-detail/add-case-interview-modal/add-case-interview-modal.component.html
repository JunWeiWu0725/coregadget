<!-- 新增／修改認輔 Modal -->


<!-- 個案輔導紀錄 -->
<div class="modal  fade " id="addCaseInterview" tabindex="-1" role="dialog" aria-labelledby="addInterviewLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <!-- <ng-container *ngIf="globalService.mode" >
          a1b2c3d4-e5f6-7890-abcd-ef1234567890 2級輔導 修改 modal 
        
         </ng-container> -->
        <h5 class="modal-title" id="addInterviewLabel">
          <ng-container *ngIf="globalService.mode" >
            a6f0f1e4-9f7d-4a7e-a6d3-b9d1d6d9e2f5
           </ng-container>
          <b>{{ editModeString }}個案晤談紀錄 - {{ _CaseInterview.StudentName }}</b>
        </h5>
        <button type="button" class="close" (click)="cancel()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-row mt-2">
          <div class="form-group col-md-2">
            <label for="schoolYear" class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isSchoolYearHasValue">*</span>
              <b class="modal-sub-title"> 學年度</b>
            </label>
            <input type="text" class="form-control" id="schoolYear" placeholder="請輸入學年度"
              [(ngModel)]="_CaseInterview.SchoolYear" (keyup)="_CaseInterview.checkValue()" />
          </div>
          <div class="form-group col-md-2">
            <label for="semester" class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isSemesterHasValue">*</span>
              <b class="modal-sub-title">學期</b>
            </label>
            <input type="text" class="form-control" id="semester" placeholder="請輸入學期"
              [(ngModel)]="_CaseInterview.Semester" (keyup)="_CaseInterview.checkValue()" />
          </div>
          <div class="form-group col-md-2">
            <label for="interviewDate" class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isOccurDateHasValue">*</span>
              <b class="modal-sub-title">晤談日期 </b>
            </label>
            <input type="date" class="form-control" id="interviewDate" placeholder="請輸入晤談日期"
              [(ngModel)]="_CaseInterview.OccurDate" (keyup)="_CaseInterview.checkValue()"
              (ngModelChange)="_onDateChange($event)"  />
          </div>
          <div class="form-group col-md-2">
            <label for="MeetTime" class="col-form-label text-center">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isOccurDateHasValue">*</span>
              <b class="modal-sub-title"> 星期 </b> 
            </label>
            <label class="form-control" id="MeetTime">{{
            '星期' +dayOfWeek 
              }}</label>
    
          </div>
          <div class="form-group col-md-3">
         
            <label for="interviewDate" class="col-form-label ">
              <!-- <span class="text-samll text-danger">*</span> -->
              <b class="modal-sub-title"> 晤談時間</b> 
            </label>
            <input type="text" class="form-control" id="interviewDate" placeholder="晤談時間"
              [(ngModel)]="_CaseInterview.MeetTime"
             />
          </div>
          <!-- <div *ngIf="dayOfWeek">
            選擇的日期是: {{ dayOfWeek }}
        </div> -->
        </div>
        <div class="form-row">
          <div class="form-group col-md-3 row ">
            <label class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isCounselTypeHasValue">*</span>
              <b class="modal-sub-title">方式：</b>
            </label>
            <div class="input-group mb-3 ml-3 inline-dropdown">
              <div class="input-group-prepend">
                <button class="btn btn-light dropdown-toggle w-100" type="button" data-toggle="dropdown"
                  aria-haspopup="true" aria-expanded="false">
                  {{ _CaseInterview.selectCounselType }}
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('面談')">面談</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('電話')">電話</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('聯絡簿')">聯絡簿</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('個別約談家長')">個別約談家長</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('會議')">會議</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('E-mail')">E-mail</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setCounselType('其他')">其他</a>
                </div>
              </div>
              <ng-container *ngIf="_CaseInterview.isCounselTypeOtherDisable === false">
                <input type="text" id="CounselType" class="form-control" [(ngModel)]="_CaseInterview.CounselTypeOther"
                  [disabled]="_CaseInterview.isCounselTypeOtherDisable" />
              </ng-container>
            </div>
          </div>

          <div class="form-group col-md-3 row">
           <span></span> <label class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isContactNameHasValue">*</span>
              <b class="modal-sub-title">對象：</b>
            </label>
            <div class="input-group mb-3 inline-dropdown">
              <div class="input-group-prepend ml-3">
                <button class="btn btn-light dropdown-toggle w-100" type="button" data-toggle="dropdown"
                  aria-haspopup="true" aria-expanded="false">
                  {{ _CaseInterview.selectContactName }}
                </button>
                <div class="dropdown-menu">
                  <a class="dropdown-item" (click)="_CaseInterview.setContactName('學生')">學生</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setContactName('教職員')">教職員</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setContactName('家長')">家長</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setContactName('專業人員')">專業人員</a>
                  <a class="dropdown-item" (click)="_CaseInterview.setContactName('其他')">其他</a>
                </div>
              </div>
              <ng-container *ngIf="_CaseInterview.isContactNameOtherDisable === false">
                <input type="text" id="CounselType" class="form-control"
                  [(ngModel)]="_CaseInterview.ContactNameOther" />
              </ng-container>
            </div>
          </div>
          <div class="form-group col-md-4">
            <label class="col-form-label">
              <span class="text-samll text-danger"></span>
              <b class="modal-sub-title">個案編號：</b>
              <div class ="inline-dropdown"> {{ _CaseInterview.CaseNo }}</div>
              <!-- <span class="input-group mb-3"></span> -->
            </label>
          </div>
        </div>


        <div class="form-group col-md-12">
          <div class="custom-control custom-checkbox">
            <input type="checkbox" class="custom-control-input" id="isPublic" (click)="_CaseInterview.checkValue()"
              (keyup)="_CaseInterview.checkValue()" [(ngModel)]="_CaseInterview.isPublic" />
            <label class="custom-control-label" for="isPublic">輔導資料公開給輔導室，以利銜接。 
           </label>
          </div>
        </div>

        <div class="form-row">
          <!-- 內容說明 -->
          <div class="form-group col-md-12  ">
            <label for="contentdescription" class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isContentHasValue">*</span>
              <b class="modal-sub-title"> 內容說明</b>
              <span class=" text-muted"></span>
            </label>
            <textarea id="contentdescription" (input)="autoResize($event.target)"
              (input)="onChange($event)"
              class="form-control my-3 p-3" rows="8" 
              placeholder="請輸入內容說明" 
              (keyup)="_CaseInterview.checkValue()"></textarea>
          </div>
        </div>
        <!-- 上傳檔案 -->

        <div class="d-flex">
          <div class="image-upload ml-3">
            <span class="upload-file-btn">
              <span class="text">
                <label for="fileInput">
                  選擇檔案
                </label>
              </span>
              <span class="icon">
                <mat-icon (mouseover)="isShowInfo = true" (mouseout)="isShowInfo = false" aria-hidden="false"
                  aria-label="Example home icon" style="cursor:pointer ;font-size: 17px;  position:relative"
                  class="material-symbols-outlined material-icons-align">
                  info
                </mat-icon>
              </span>
            </span>
            <input style="display:none" #fileInput id="fileInput" name="imageUrl" type="file" accept="application/pdf"
              (change)="handleInputChange($event)" />

            <div *ngIf="isShowInfo" class="info_section ">
              僅能上傳 3MB 以下 PDF檔
            </div>
          </div>
          <div class="p-1 m-2" *ngIf=" this.fileUpladed?.FileName"
            style="border:1px soild gray ; height:15px; min-width:200px">
            <a style=" text-decoration: none;" [href]="fileUpladed.href" [download]="fileUpladed.FileName">
              {{ this.fileUpladed.FileName }}
            </a>
            <span (click)="deleteFile()">
              <mat-icon style="cursor: pointer; color :gray ; font-size: 17px;" class="" aria-hidden="false"
                aria-label="Example home icon" (click)="delete(item)">
                highlight_off
              </mat-icon>
            </span>
          </div>
        </div>
        <!-- //   個案類別  -->
        <div class="form-row">
          <div class="form-group col-md-12 ">
            <label for="semester" class="col-form-label">
              <span class="text-samll text-danger" *ngIf="!_CaseInterview.isCategoryHasValue">*</span>
              <b class="modal-sub-title"> 類別</b>
            </label>
            <div class="d-flex flex-wrap ml-3" style="">
              <div class="custom-control custom-checkbox w-25" *ngFor="let item of _CaseInterview._category">
                <input type="checkbox" class="custom-control-input" [id]="item.answer_code"
                  [checked]="item.answer_checked" (click)="item.setAnswerCheck()"
                  (change)="checkChange(item,_CaseInterview)" />
                <label class="custom-control-label" [for]="item.answer_code">
                  <app-sentence [text]="item.answer_text" [(ngModel)]="item.answer_martix"></app-sentence>
                </label>
              </div>


              <!-- <p class="mt-3" style="font-size: 10px; "> 註:此類別不會被統計至工作月統計報表內，工作月統計報表之統計為個案上之個案類別。</p> -->

            </div>
          </div>
        </div>


        <div class="form-row">
          <div class="form-group col-md-12">


            {{''}}
          </div>
        </div>



        <div class="modal-footer">
          <button *ngIf="_editMode=='add'" type="button" class="btn btn-dark" [disabled]="_CaseInterview.isSaveDisable"
            (click)="save(true)">
            輸入服務項目
          </button>
          <button type="button" class="btn btn-dark" (click)="cancel()">
            取消
          </button>
          <button type="button" class="btn btn-info" [disabled]="_CaseInterview.isSaveDisable" (click)="save()">
            儲存
          </button>
        </div>
      </div>
    </div>
  </div>
