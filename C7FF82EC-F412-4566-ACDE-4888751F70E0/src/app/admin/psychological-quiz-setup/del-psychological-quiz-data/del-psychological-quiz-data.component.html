<div class="modal fade"
     id="delPsychologicalQuizData"
     tabindex="-1"
     role="dialog"
     aria-labelledby="delPsychologicalQuizDataLabel"
     aria-hidden="true">
  <div class="modal-dialog"
       role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"
            id="delPsychologicalQuizDataLabel">
          確定刪除 {{quizData.QuizName}}？
        </h5>
      </div>
      <div class="modal-body">
        <div class="m-3">

          刪除心理測驗資料時會一併刪除已匯入的心理測驗結果，請確認是是否進行刪除。

        </div>

        <div class="modal-footer">
          <button type="button"
                  class="btn btn-dark"
                  data-dismiss="modal"
                  (click)="cancel()">
            取消
          </button>
          <button type="button"
                  class="btn btn-danger"
                  (click)="del()">
            刪除
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
