<div
  class="modal fade"
  id="app_import_modal"
  tabindex="-1"
  role="dialog"
  aria-labelledby="modal-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">{{ "匯入一級輔導" }}</h5>
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="semester" class="col-form-label"> 學生匯入方式 </label>
          <div>
            <div>
              <div class="custom-control custom-radio mb-2">
                <input
                  type="radio"
                  id="r1"
                  name="grantradio"
                  class="custom-control-input"
                  [(ngModel)]="importMode"
                  [value]="'bySeat'"
                />
                <label class="custom-control-label ml-2" for="r1"
                  >班級座號</label
                >
              </div>

              <div class="custom-control custom-radio mb-2">
                <input
                  type="radio"
                  id="r2"
                  name="grantradio"
                  class="custom-control-input"
                  [(ngModel)]="importMode"
                  [value]="'byStudentId'"
                />
                <label class="custom-control-label ml-2" for="r2">學號</label>
              </div>
            </div>
            <div
              class="custom-control custom-radio custom-control-inline"
            ></div>
          </div>
        </div>

        <div class="form-group">
          <label for="" class="col-form-label"> 需要欄位 </label>
          <div class="d-flex flex-wrap">
            {{ "" }}
          </div>
        </div>

        <div class="form-group"></div>

        <div class="form-group">
          <label class="btn btn-info">
            <input
              type="file"
              accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
              (change)="onFileSelected($event)"
              #fileInput
              (click)="fileInput.value = null"
              value=""
              style="display: none"
            />
            <i class=""></i> 請選擇 Excel 檔
          </label>
        </div>
      </div>

      <div *ngIf="showErrorMsg" class="m-3 ">
        <h5 class="text-danger">驗證錯誤</h5>
        <table class="table table-bordered table-sm">
          <thead class="thead-light">
            <tr>
              <th>行號</th>
              <th>欄位</th>
              <th>錯誤描述</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let err of errorList">
              <td>{{ err.row }}</td>
              <td>{{ err.column }}</td>
              <td class="text-danger">{{ err.message }}</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-dark" data-dismiss="modal">
          取消
        </button>
        <button type="button" class="btn btn-info" (click)="insertCunsels()">
          匯入
        </button>
      </div>
    </div>
  </div>
</div>
