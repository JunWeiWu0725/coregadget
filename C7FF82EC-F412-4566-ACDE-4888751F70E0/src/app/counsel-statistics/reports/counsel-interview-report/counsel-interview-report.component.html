<div *ngIf="isLoading" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">載入中...</div>
</div>
<div style="height: 20px">
</div>
<div class = " d-flex justify-content-center   w-100">
<!-- 導師輔導記錄 -->
<div class="d-flex"  style =" width: 90%;">

  <app-import-modal #app_import_modal  [StudentList]="[]" [Role]="'管理者'" ></app-import-modal>
  <div class="d-flex align-items-center" style="width: 90%;"> 
    <div class="date-label" style="font-size: 18px; margin-right: 10px; min-width: 80px;">開始日期</div>
    <div style="margin-right: 20px;">
      <input required
             type="date"
             class="form-control"
             id="startDate"
             name="startDate"
             placeholder="請輸入開始日期"
             [(ngModel)]="startDate" />
    </div>
    <div class="date-label" style="font-size: 18px; margin-right: 10px; min-width: 80px;">結束日期</div>
    <div style="margin-right: 20px;">
      <input required
             type="date"
             class="form-control"
             id="endDate"
             name="endDate"
             placeholder="請輸入結束日期"
             [(ngModel)]="endDate" />
    </div>

  </div>
  <button 
  *ngIf="true"  
  style="
    color:#2f8e80;
    border: 1px solid #a0cfc8; 
    padding: 6px 16px; 
    font-size: 14px; 
    border-radius: 4px;
    cursor: pointer;
  "
  (click)="modalImportShow()">
  匯入一級晤談紀錄
</button>
<button type="button" class="btn btn-info btn-sm" (click)="openChartModal()" *ngIf="true">數據分析</button>
<app-chart-modal #chartModal></app-chart-modal>
</div>


<div style="height: 20px">
</div>

</div>

<div style="height: 20px"></div>
<app-condition-modal #condition_modal></app-condition-modal>

<div class="w-100  d-flex  justify-content-center">

  <div class="tab-content " style=" width:90%" >
    <div class=" all-class-select-section">
      <span class="custom-control custom-checkbox w-25">
        <mat-icon class="m-0  p-0  w-100 small-icon " style="display: inline;" [hidden]="!isSelectAllItem"
          aria-hidden="false" aria-label="Examplehome icon">
          done_all
        </mat-icon>
        <span (click)="SetSelectAllItem()">全選
        </span>
      </span>
      <div class="d-flex flex-wrap pl-3">
      </div>
    </div>
  
    <ng-container *ngFor="let item of SelectGradeYearList">
      <div class=" mt-2 grade-select-section">
        <div class=" grade-schow-borad " (click)="openGradeSection(item)">
  
          <mat-icon class="small-icon" *ngIf="!item.isOpen" class="" aria-hidden="false" aria-label="Example home icon">
            add
          </mat-icon>
          <mat-icon class="small-icon" *ngIf="item.isOpen" class="" aria-hidden="false" aria-label="Example home icon">
            remove
          </mat-icon>
          <!-- 年級section  -->
          {{item.GradeYearStr}}
        </div>
  
        <ng-container *ngIf="item.isOpen">
  
  
  
          <div class="d-flex flex-wrap pl-3 ">
            <div class="text-center" (click)="SetSelectGradeItem(item.GradeYear)" [ngClass]="'class-select-section'">

              所有班級
            </div>
          </div>
          <div class="d-flex flex-wrap pl-3">
  
  
            <div class="text-center" [ngClass]="ClassItem.getCheckClass()"
              *ngFor="let ClassItem of item.ClassItems" (click)="toggleClassSelected(ClassItem)">
       
              {{ClassItem.ClassName}}
            </div>
          </div>
  
        </ng-container>
  
      </div>
    </ng-container>
    <div class="mt-2 ml-auto align-self-center ml-3 float-right">
      <button type="button " class="btn btn-info  export-btn" (click)="report()" [disabled]="isSaveButtonDisable">
        產出報表
      </button>
    </div>
  </div>

</div>
