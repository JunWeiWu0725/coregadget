<ul class="rwd-table">
  <li class="thead">
    <ol class="tr">
      <li class="sticky-top">年級</li>
      <li class="sticky-top">班級</li>
      <li *ngFor="let subject of comprehensiveComponent.currentSection.Subject"
          class="sticky-top">{{subject |filterChineseNumbers }}</li>
      <li class="sticky-top">開啟</li>
    </ol>
  </li>
  <li class="tbody">
    <ol *ngFor="let classRec of comprehensiveComponent.currentSection.Class"
        class="tr">
      <li data-title="年級">{{classRec.GradeYear}}</li>
      <li data-title="班級">
        {{classRec.ClassName}}
      </li>
      <li *ngFor="let subject of comprehensiveComponent.currentSection.Subject"
          [attr.data-title]="subject.substring(0,4)"
          class="text-danger"
          [ngClass]="{'text-success': statusCheck[classRec.ClassName + '_' + subject]=='已完成', 'text-muted': statusCheck[classRec.ClassName + '_' + subject]=='--' || statusCheck[classRec.ClassName + '_' + subject]=='...'}">
        {{statusCheck[classRec.ClassName + "_" + subject]}}
      </li>
      <li data-title="開啟">
        <a class="text-info"
           [routerLink]="[ '/comprehensive', 'view', classRec.ClassID, 'section', fillInSectionID]">開啟
        </a>
      </li>
    </ol>
  </li>
</ul>
