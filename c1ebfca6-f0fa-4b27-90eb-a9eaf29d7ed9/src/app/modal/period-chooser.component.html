      <div class="modal-header px-0 pt-0 align-items-start">
        <h5 class="modal-title" id="choosePeriodTitle">
          {{title}}
        </h5>
        <button (click)="dialogRef.close()" type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body px-0 text-center">
        <div *ngIf="!periods">loading...</div>
        <button mat-raised-button *ngFor="let period of periods" [disabled]="allow_choose(period)" (click)="gotoPick(period)" class="gd-button-primary m-2">{{period.Name}}</button>
