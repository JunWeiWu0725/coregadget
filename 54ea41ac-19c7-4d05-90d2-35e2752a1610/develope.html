      <div class="row-fluid">
        <div class="span12" id="behavior">
          <div class="row-fluid">
            <div class="span12">

                    <div class="thumbnails" id="demerit-d"></div>
                    <div class="grid grid-cols-3 lg:grid-cols-6 gap-4 font-semibold mt-4">
                      <div class="thumbnail my-thumbnail-white py-3 rounded-lg">
                        <div class="my-subthumbnail-top" id="merit-a"><span class="text-3xl">0</span>
                        </div>
                        <div class="caption my-subthumbnail-bottom text-base">
                          <div>大功</div>
                        </div>
                      </div>
                      <div class="thumbnail my-thumbnail-white py-3 rounded-lg">
                        <div class="my-subthumbnail-top" id="merit-b"><span class="text-3xl">0</span>
                        </div>
                        <div class="caption my-subthumbnail-bottom text-base">

                        </div>
                      </div>
                      <div class="thumbnail my-thumbnail-white py-3 rounded-lg">
