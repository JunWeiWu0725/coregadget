<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta content="text/html;charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/js/gadget.js"></script>
  <script>
    init({
      application: "test.emba.ntu.edu.tw",
      oAuth: {
        clientID: 'b88fbfbbaa848c5b5b01ce51853eac7f',
        clientSecret: '0911245ae08323086790244cd319c1c3bbde1096520154f0cbcb71f0ff76e311',
        account: '',
        password: ''
      },
      paramValues: {}
    });
    document.addEventListener("DOMContentLoaded", () => {
      // 強制將焦點設定在標題上
      const mainHeading = document.getElementById('main-heading');
      if (mainHeading) {
        mainHeading.focus();
      }
    });
  </script>
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="bootstrap/css/bootstrap-responsive.min.css" rel="stylesheet" />
  <link href="css/default.css" rel="stylesheet" />
  <link href="css/base.css" rel="stylesheet" />
  <link href="css/purge.css" rel="stylesheet" />
  
  <script src="js/jquery.min.js"></script>
  <script src="bootstrap/js/bootstrap.min.js"></script>
  <script src="js/default.js"></script>
</head>

<body>
  <div id="widget" class="my-page text-sm" style="margin-top: 20px; padding-top: 0;">
    <div class="page-container">
      <div class="header-space"></div>
      <div class="content container-fluid">
        <div id="absence">
          <div class="row-fluid">            
            <h1 id="main-heading" class="text-center md-hidden" tabindex="-1" aria-label="缺課記錄,標題" style="outline: none; font-size: 18px; font-weight: 500; border: none; line-height: 36px; left: 0; padding: 0; margin: 0px;">
              <span aria-hidden="true">缺課記錄</span></h1>
            <div class="flex whitespace-nowrap mb-4">
              <label for="schoolYearInput" class="btn btn-inverse disabled px-2">學年度</label>
              <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                class="w-full max-w-28 !mb-0 text-md"
                placeholder="請輸入學年度"
                id="schoolYearInput"
                target="schoolYear"
                aria-label="學年度，輕觸兩下即可啟用"
              />
    
              <div class="btn-group">
                <button
                  class="btn btn-inverse dropdown-toggle"
                  style="height: 100%; padding: 6px 8px;"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                  aria-controls="semester-options-list"
                  aria-label="學期，選單，輕觸兩下即可啟用"
                  id="semester-dropdown-button"
                >
                  <span id="selected-semester-text" for="semester-options-list" target="semester">學期</span>
                  <span class="caret"></span>
                </button>
                <ul class="dropdown-menu font-base" target="semester-options" id="semester-options-list" role="menu">
                  <li role="none"><a href="#" value="0" role="menuitem" style="line-height: 42px;">夏季學期</a></li>
                  <li role="none"><a href="#" value="1" role="menuitem" style="line-height: 42px;">第 1 學期</a></li>
                  <li role="none"><a href="#" value="2" role="menuitem" style="line-height: 42px;">第 2 學期</a></li>
                </ul>
                <!-- 無障礙：用於宣告選取變更的 live region -->
                <div class="sr-only" aria-live="polite" aria-atomic="true" id="semester-announcement"></div>
              </div>
    
              <a href="#" class="flex items-center btn btn-primary rounded-none px-2" target="query" id="query-button" role="button" aria-label="查詢，按鈕，輕觸兩下即可啟用">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="m18.031 16.617l4.283 4.282l-1.415 1.415l-4.282-4.283A8.96 8.96 0 0 1 11 20c-4.968 0-9-4.032-9-9s4.032-9 9-9s9 4.032 9 9a8.96 8.96 0 0 1-1.969 5.617m-2.006-.742A6.977 6.977 0 0 0 18 11c0-3.867-3.133-7-7-7s-7 3.133-7 7s3.133 7 7 7a6.977 6.977 0 0 0 4.875-1.975z" />
                </svg>
                <span class="ml-1">查詢</span>
              </a>
            </div>
            <div class="py-4" tabindex="0" id="query-result-count" style="display: none;">查詢結果：共0筆</div>
          </div>
          <div class="row-fluid">
            <div class="dis-show" id="absence-cards"></div>
            <div class="dis-none !min-h-[65vh]" id="absence-detail">
              <table class="table table-bordered my-table">
                <!-- <caption id="absence-table-description" class="sr-only">顯示學生的缺課紀錄，包含學年度、學期、課程名稱、課程識別碼、上課日期、上課時間及補課訊息。</caption> -->
                <thead>
                  <tr>
                    <th class='whitespace-nowrap' scope="col">學年度</th>
                    <th scope="col">學期</th>
                    <th scope="col">課程名稱</th>
                    <th scope="col">課程識別碼</th>
                    <th scope="col">上課日期</th>
                    <th scope="col">上課時間</th>
                    <th scope="col">補課訊息</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td colspan="7" class="text-center" id="no-data-message">目前沒有符合條件的缺課資料，請輸入學年度及學期進行查詢。</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer css_table p-2">
      <div class="flex justify-center items-center flex-col md:flex-row gap-3">
        <div class="flex gap-3">
          <img src="src/red_logo.jpg" class="max-w-full" />
          <img src="src/bot_logo.png" class="max-w-full" />
        </div>
        <div class="grid gap-1 text-sm">
          <div>台北市大安區羅斯福路四段一號 臺灣大學管理學院一號館六樓 EMBA辦公室</div>
          <div>TEL:886-2-33661010 FAX:886-2-23636073</div>
          <div>Copyright © National Taiwan University All Rights Reserved</div>
        </div>
      </div>
    </div>

  </div>

</body>

</html>
