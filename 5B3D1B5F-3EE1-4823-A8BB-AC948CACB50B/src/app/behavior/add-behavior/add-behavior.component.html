<div id="behavior-add">
  <nav aria-label="breadcrumb text-nowrap text-truncate">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <span class="point" [routerLink]="['/']">主頁</span>
      </li>
      <li class="breadcrumb-item">
        <span class="point">新增</span>
      </li>
      <button class="ml-auto btn btn-dark" [routerLink]="['/template']">事由樣板</button>
    </ol>
  </nav>

  <!-- 第一區塊：日期、事由、選項、儲存 -->
  <div class="row">
    <!-- 第一欄：日期與樣板選擇 (左側) -->
    <div class="col-md-4 col-lg-3">
      <div class="form-group mb-3">
        <label for="dateLabel" class="form-label">日期</label>
        <input type="date"
               class="form-control"
               id="dateLabel"
               #currentDate
               [(ngModel)]="currentDateString"
               (change)="currentDateChange(currentDate.value)">
      </div>

      <div class="form-group mb-0">
        <label class="form-label">選擇事由</label>
        <div class="dropdown">
          <button class="btn btn-outline-primary dropdown-toggle w-100"
                  type="button"
                  data-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false">
                  選擇事由
          </button>
          <div class="dropdown-menu w-100">
            <a class="dropdown-item"
               href="javascript:;"
               *ngFor="let data of commentTemplateList"
               (click)="selectItem(data)">{{data.Comment}}</a>
          </div>
        </div>
      </div>
    </div>

    <!-- 第二欄：事由輸入區 (中間) -->
    <div class="col-md-8 col-lg-6"> 
      <div class="form-group mb-0">
        <label class="form-label">事由</label>
        <textarea
               class="form-control"
               placeholder="Comment..."
               [(ngModel)]="addText"
               rows="7"></textarea>
      </div>
    </div>

    <!-- 第三欄：選項 (右側) -->
    <div class="col-md-12 col-lg-3">
      <div class="form-group mb-3">
        <label class="form-label d-block">TAGS</label>
        <div class="form-check">
          <input id="detention"
                 type="checkbox"
                 class="form-check-input"
                 (change)="onCheckboxChange('detention')"
                 [(ngModel)]="currentDetention">
          <label class="form-check-label" for="detention">Detention</label>
        </div>

        <div class="form-check">
          <input id="goodBehavior"
                 type="checkbox"
                 class="form-check-input"
                 (change)="onCheckboxChange('goodBehavior')"
                 [(ngModel)]="currentGoodBehavior">
          <label class="form-check-label" for="goodBehavior">Good</label>
        </div>    
        
        <div class="form-check">
          <input id="currentDaaDsaFollow" 
                  type="checkbox" 
                  class="form-check-input" 
                  (change)="onCheckboxChange('currentDaaDsaFollow')"
                  [(ngModel)]="currentDaaDsaFollow">
          <label class="form-check-label" for="currentDaaDsaFollow">DAA/DSA Follow up</label>
        </div>
      </div>

      <!-- 排序選項 (搬移至此以符合風格) -->
      <div class="form-group mb-3">
        <label class="form-label">排序</label>
        <mat-form-field style="width: 100%;" appearance="outline">
          <mat-select [(value)]="sortType" (selectionChange)="onSortChange()">
            <mat-option value="seat">Seat Order (班座排序)</mat-option>
            <mat-option value="studentNumber">Student ID Order (學號排序)</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- 最後更新時間 -->
      <div class="mb-2" *ngIf="lastUpdateTime">
        <small class="text-muted">
          <i class="material-icons" style="font-size: 14px; vertical-align: middle;">schedule</i>
          最後更新: {{lastUpdateTime}}
        </small>
      </div>

      <!-- 儲存按鈕 -->
      <button class="btn btn-info btn-block mt-2"
              [disabled]="checkButtonEnable"
              (click)="save()">儲存 （已選取: {{selectedStudents.length}}）</button>
    </div>
  </div>

  <!-- 第二區塊：已選取學生清單 -->
  <hr>
  <div class="mt-3">
    <div class="mb-2">
      <span style="color: #94a3b8; font-weight: 600;">已選擇學生：</span>
    </div>

    <div class="st-list d-flex flex-wrap">
      <!-- 空白占位符 -->
      <div class="card w-100" *ngIf="!selectedStudents.length"
           style="height: 200px; border: 2px dashed #e2e8f0; background: transparent; display: flex; align-items: center; justify-content: center;">
        <b style="color: #94a3b8;">請從下方選取學生</b>
      </div>

      <!-- 學生卡片 -->
      <div class="card" style="height:300px" *ngFor="let data of selectedStudents; let i = index">
        <a style="position:absolute;top:8px;right:8px;cursor: pointer; z-index: 10;" (click)="clickPicture(data)">
          <i class="material-icons" style="color:white;font-size:2em; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">clear</i>
        </a>
        <div style="height: 240px;width: 100%;">
          <div style="height:100%;width:100%;background-position: center center;background-size: cover; border-radius: 8px 8px 0 0;"
               [style.background-image]="'url(' + data.PhotoUrl + ')'"></div>
        </div>
        <div class="card-body py-2 text-truncate" style="width: 100%;height: 60px;">
          <b>{{data.Name}}</b> ({{data.SeatNo}}號)
          <span style="float: right; color: #64748b;">{{data.StudentNumber}}</span>
        </div>
      </div>
    </div>
  </div>

  <hr>

  <!-- 第三區塊：班級選擇 -->
  <div class="d-flex align-items-center mt-4 mb-3">
    <mat-form-field style="width: 200px;" appearance="outline">
      <mat-label>選擇班級</mat-label>
      <mat-select (selectionChange)="onClassSelected()" [(value)]="selectedClass">
        <mat-option *ngFor="let cls of classes" [value]="cls">{{cls.Name}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <!-- 第四區塊：學生選取區域 -->
  <div class="st-list d-flex flex-wrap mt-3">
    <div class="card st-check" style="height:300px" *ngFor="let data of studentDataList; let i = index">
      <input type="checkbox" id="stCheck{{data.ID}}" [(ngModel)]="data.checked" (change)="clickPicture(data)" />
      <label for="stCheck{{data.ID}}">
        <div style="height: 240px;width: 100%;">
          <div style="height:100%;width:100%;background-position: center center;background-size: cover; border-radius: 8px 8px 0 0;"
               [style.background-image]="'url(' + data.PhotoUrl + ')'"></div>
        </div>
        <div class="card-body py-2 text-truncate" style="width: 100%;height: 60px;">
          <b>{{data.Name}}</b> ({{data.SeatNo}}號)
          <br>
          <span style="color: #64748b;">{{data.StudentNumber}}</span>
        </div>
      </label>
    </div>
  </div>
</div>
