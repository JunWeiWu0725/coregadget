<div class="container-fluid">
  <h1 class="title-item mb-4">導師-線上點名</h1>
  <div class="row">
    <div class="col-md-12">
      <div class="control-section">
        <div *ngIf="canCrossDate" class="form-group">
          <label class="control-label">選擇日期：</label>
          <div class="date-controls">
            <div class="input-group" style="width: 200px;">
              <input type="text"
                     class="form-control"
                     [ngModel]="inputDate"
                     (ngModelChange)="checkDate($event)" />
            </div>
            <div class="input-group-append" style="display: inline-block; margin-left: 10px;">
                <button type="button"
                        class="btn btn-outline-primary"
                        (click)="setCurrentDate(todayDate)"
                        [ngClass]="{'btn-primary': getDateString(currentDate)==getDateString(todayDate)}">今天
                </button>
                <button type="button"
                        (click)="setCurrentDate(currentDate, -1)"
                        class="btn btn-outline-secondary">&lt;&lt;
                </button>
                <button type="button"
                        *ngFor="let qdate of quickSelectDate"
                        class="btn btn-outline-secondary"
                        [ngClass]="{'btn-warning': getDateString(qdate)==getDateString(currentDate), 'today-date': getDateString(qdate)==getDateString(todayDate)}"
                        (click)="setCurrentDate(qdate)">{{getDisplayDateString(qdate)}}
                </button>
                <button type="button"
                        (click)="setCurrentDate(currentDate, 1)"
                        class="btn btn-outline-secondary">>>
                </button>
              </div>
            </div>
            <div *ngIf="inputDate!=getDateString(currentDate)" class="text-danger mt-1">
              日期格式錯誤
            </div>
          </div>
          <div *ngIf="!canCrossDate" class="form-group">
            <label class="control-label">選擇日期：</label>
            <span class="date-display">{{getDateString(todayDate)}}</span>
          </div>
          <div class="form-group">
            <label class="control-label">請選擇班級：</label>
            <div class="btn-group" role="group" aria-label="班級選擇">
              <button *ngFor="let item of classes"
                      (click)="toggleClassDate(item)"
                      type="button"
                      class="btn btn-outline-primary"
                      [ngClass]="{'btn-primary': selClass==item, 'btn-outline-primary': selClass!=item}">{{item.className}}</button>
            </div>
          </div>
          <div *ngIf="selClass" class="form-group">
      <!-- 可編輯時顯示假別選擇 -->
      <div *ngIf="canEdit()" class="form-group">
        <label class="control-label">請選擇假別：</label>
        <div class="btn-group" role="group" aria-label="假別選擇">
          <button (click)="currAbs=clearAbs"
                  type="button"
                  class="btn btn-outline-primary"
                  [ngClass]="{'btn-primary': currAbs==clearAbs, 'btn-outline-primary': currAbs!=clearAbs}">清除</button>
          <button *ngFor="let abs of absences"
                  (click)="currAbs=abs"
                  type="button"
                  class="btn btn-outline-primary"
                  [ngClass]="{'btn-primary': currAbs==abs, 'btn-outline-primary': currAbs!=abs}">{{abs.name}}</button>
        </div>
      </div>
        </div>
      
    <!-- 不可編輯時顯示說明文字 -->
    <div *ngIf="!canEdit()" class="form-group">
      <div class="alert alert-info" role="alert">
        <i class="fas fa-info-circle"></i> 目前僅提供查閱
      </div>
    </div>
    <table class="table table-bordered table-hover table-striped"
           style="margin-top: 15px;">
      <thead>
        <tr class= "sticky">
          <th class="thBorder"
              style="min-width:110px;">
              <!-- 可編輯時顯示儲存按鈕 -->
            <div *ngIf="canEdit()">
              <div class="btn-group">
                <button  [disabled]="isLoading" (click)="saveData()"
                        type="button"
                        class="btn btn-sm"
                        [ngClass]="{'btn-success': completed=='t', 'btn-warning': completed!='t'}">
                  {{(completed=='t') ? '儲存變更 '+getDisplayDateString(currentDate)+'' : '完成點名'+getDisplayDateString(currentDate)+''}}
                </button>
              </div>
              <span *ngIf="completed=='t'"
                    class="text-muted">
                已點名
              </span>
            </div>
            <!-- 不可編輯時不顯示儲存按鈕 -->
          </th>
          <th *ngIf="isShowCheckInTime"   class=" text-center" > 入校時間 </th>
          <th *ngFor="let period of periods"
              (click)="canEdit() && setAllStudentsAbs(period)"
              class="setBtn thBorder text-center"
              [class.disabled]="!canEdit()">
            {{period.name}}
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let stu of students;let i = index">
          <!-- <tr *ngIf="i > 0 && i % 5 ==0">
            <th class="thBorder">
            </th>
            <th *ngFor="let period of periods"
                (click)="setAllStudentsAbs(period)"
                class="setBtn thBorder text-center">
              {{period.name}}
            </th>
          </tr> -->
          <tr>
      
            <td (click)="canEdit() && setStudentAllPeriodAbs(stu)"
                class="setBtn"
                [class.disabled]="!canEdit()">
               <span class="name-item">
                 {{stu.seatNo}}. {{stu.name}}

               </span> 
            </td>
            <td *ngIf="isShowCheckInTime"  class=" text-center"> 
              {{getCheckInTime(stu.sid)?.checkin_only_time|| "--"}}
            </td>
            <td *ngFor="let period of periods"  class=" text-center"
                (click)="canEdit() && setStudentPeroidAbs(stu, period)"
                title="{{period.name}}"
                [class.setBtn]="!(stu.leaveList.get(period.name)?.isLock)"
                [class.disabled]="!canEdit()"
                style="position:relative">
              <div *ngIf="stu.leaveList.get(period.name)?.absName != stu.orileaveList.get(period.name)?.absName"
                   style="display:inline-block;background-color:red;position:absolute;left:3px;top:3px;width:5px;height:6px;border-radius:5px;"></div>
              <span [class.text-muted]="(stu.leaveList.get(period.name)?.isLock)">
                {{toShort(stu.leaveList.get(period.name)?.absName)}}
              </span>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
    <p *ngIf="students.length==0">目前無資料</p>
  </div>
</div>
