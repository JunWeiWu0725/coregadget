<div *ngIf="contract;else Loading"
     class="main-menu d-flex flex-wrap justify-content-center">
    <div (click)="goGradebook()" *ngIf="display('gradebook')">
        <img class="show-icon" src="assets/img/gradebook.svg">
        <div>Gradebook</div>
    </div>
    <div [routerLink]="['/behavior']" *ngIf="display('behavior')">
        <img class="show-icon" src="assets/img/behavior.svg">
        <div>Behavior</div>
    </div>
    <div [routerLink]="['/attendance']" *ngIf="display('attendence')">
        <img class="show-icon" src="assets/img/attendence.svg">
        <div>Attendance</div>
    </div>
    <div [routerLink]="['/weekly_report']" *ngIf="display('weekly-report')">
        <img  class="show-icon" src="assets/img/routineReport.svg">
        <div>Routine Report</div>
    </div>
</div>
<ng-template #Loading>
    <div style="position:absolute;top:50%;left: 0px;right: 0px;text-align: center;">
        loading...
    </div>
</ng-template>
