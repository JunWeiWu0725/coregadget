<!-- 單一課程列表 -->
<div id="behavior-list">
    <nav aria-label="breadcrumb text-nowrap text-truncate">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <span class="point"
                      [routerLink]="['/']">Home</span></li>
            <li class="breadcrumb-item">
                <span class="point"
                      [routerLink]="['/behavior']">Behavior</span></li>
            <li class="breadcrumb-item active"
                aria-current="page">{{courseName}}</li>
            <button class="ml-auto btn btn-dark"
                    [routerLink]="['/behavior/comment']">Comment Template</button>
        </ol>
    </nav>
    <ul class="list-group mb-3">
        <li class="list-group-item active d-flex align-items-center py-2">
            {{courseName}}
            <button class="ml-auto btn btn-info"
                    [routerLink]="['/behavior/add', courseID, courseName]"><i
                   class="material-icons mr-1">add</i>ADD</button>
        </li>
        
        <!-- Loading 狀態 -->
        <li class="list-group-item text-center" *ngIf="loading">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <p class="mt-2">載入中...</p>
        </li>
        
        <!-- 沒有資料時顯示 -->
        <li class="list-group-item text-center" *ngIf="!loading && (!behaviorDataList || behaviorDataList.length === 0)">
            <p class="text-muted">目前沒有資料</p>
        </li>
        
        <!-- 資料列表 -->
        <li class="list-group-item"
            *ngFor="let data of behaviorDataList"
            [hidden]="loading">
            <div class="row">
                <div class="col-md-3 col-lg-2 text-nowrap">
                    <span class="pr-3">{{data.CreateDate2}}</span>
                    <span class="">
                        <span>{{data.Name}}</span>
                    </span>
                </div>
                <div class="col-md-9 col-lg-10">
                    <span *ngIf="data.Detention=='true'"
                          class="badge badge-danger mr-1">Detention</span>
                          <span *ngIf="data.IsGoodBehavior=='true'"
                          class="badge badge-success mr-1">Good</span>
                          <span *ngIf="data.DaaDsaFollow=='true'"
                          class="badge badge-mid mr-1">DAA/DSA Follow up</span>

                          <!-- <span *ngIf="cdata.DaaDsaFollow=='true'"
                          class="badge  badge-mid mr-1">DAA/DSA Follow up</span>
                           -->
                    <span class ="p-2 fw-boldit ">{{data.Comment}}</span>
                    <div class="float-right">
                        <a class="h6 text-info point mr-2"
                           (click)="editComment(data)">
                            <i class="material-icons mr-1">edit</i>
                        </a>
                        <a class="h6 text-danger point mr-2"
                           (click)="delete(data)">
                            <i class="material-icons mr-1">delete</i>
                        </a>
                        <!-- 最後更新時間 -->
                        <span class="text-muted small">
                            最後更新: {{data.FormattedLastUpdate}}
                        </span>
                    </div>
                </div>
            </div>
        </li>
    </ul>
</div>
