<!-- 新增 -->
<div id="behavior-add">
    <nav aria-label="breadcrumb text-nowrap text-truncate">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <span class="point" [routerLink]="['/']">Home</span></li>
            <li class="breadcrumb-item">
                <span class="point" [routerLink]="['/behavior']">Behavior</span></li>
            <li class="breadcrumb-item active" aria-current="page">{{courseName}}</li>
            <button class="ml-auto btn btn-dark" [routerLink]="['/behavior/comment']">Comment Template</button>
        </ol>
    </nav>

    <div class="evaluation-card p-4 mb-4">
        <div class="row">
            <!-- Left Column: Date & Templates -->
            <div class="col-md-3 d-flex flex-column justify-content-between">
                <div>
                    <label class="section-label">日期</label>
                    <div class="input-with-icon">
                        <i class="far fa-calendar-alt icon-left"></i>
                        <input type="date" 
                               class="custom-input" 
                               [(ngModel)]="currentDateString"
                               (change)="currentDateChange(currentDateString)">
                    </div>
                </div>
                <div class="mb-2">
                    <label class="section-label">事由範本</label>
                    <div class="dropdown w-100">
                        <button class="custom-dropdown-btn w-100 d-flex align-items-center" 
                                type="button" 
                                data-toggle="dropdown">
                            <i class="far fa-comment-dots mr-2 text-primary"></i>
                            <span>選擇事由</span>
                            <i class="fas fa-chevron-right ml-auto text-muted small"></i>
                        </button>
                        <div class="dropdown-menu w-100 shadow-sm border-0">
                            <a class="dropdown-item py-2" 
                               href="javascript:;" 
                               *ngFor="let data of commentTemplateList"
                               (click)="selectItem(data)">{{data.Comment}}</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Column: Feedback -->
            <div class="col-md-6">
                <div class="mb-2">
                    <label class="section-label mb-0">事由</label>
                </div>
                <div class="feedback-container">
                    <textarea class="custom-textarea" 
                              placeholder="事由…"
                              rows="2"
                              [(ngModel)]="addText" 
                              (change)="commentChange()"></textarea>
                    <div class="char-count">{{addText?.length || 0}} 字數</div>
                </div>
            </div>

            <!-- Right Column: Tags & Sort -->
            <div class="col-md-3 d-flex flex-column justify-content-between">
                <div>
                    <label class="section-label">標籤</label>
                    <div class="behavior-tags">
                        <label class="behavior-tag-item" [class.active]="currentDetention">
                            <input type="checkbox" [(ngModel)]="currentDetention" (change)="onCheckboxChange('detention')">
                            <span class="dot"></span> Detention
                        </label>
                        <label class="behavior-tag-item" [class.active]="currentGood">
                            <input type="checkbox" [(ngModel)]="currentGood" (change)="onCheckboxChange('goodBehavior')">
                            <span class="dot"></span> Good
                        </label>
                        <label class="behavior-tag-item" [class.active]="currentDaaDsaFollow">
                            <input type="checkbox" [(ngModel)]="currentDaaDsaFollow" (change)="onCheckboxChange('currentDaaDsaFollow')">
                            <span class="dot"></span> DAA/DSA Follow up
                        </label>
                    </div>
                </div>

                <div class="mb-2">
                    <label class="section-label">排序</label>
                    <div class="custom-mat-select-wrapper">
                        <i class="fas fa-filter icon-left"></i>
                        <mat-form-field appearance="none" class="w-100 no-line">
                            <mat-select [value]="sortType" (selectionChange)="onSortChange($event)" class="custom-select-trigger">
                                <mat-option value="seat">班座排序</mat-option>
                                <mat-option value="studentNumber">學號排序</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12 text-right">
            <button class="btn btn-save py-2 px-5" 
                    [disabled]="checkButtonEnable === 'disabled'" 
                    (click)="save()">
                儲存 （已選 : {{checkCount}}）
            </button>
        </div>
    </div>

    <div class="st-list d-flex flex-wrap mt-3 mt-lg-1">
        <div class="card st-check " 
            *ngFor="let data of studentDataList; let i = index">
            <input type="checkbox" 
                    id="stCheck{{data.ID}}" 
                    [(ngModel)]="data.checked" 
                    (change)="alert(data)">

            <label for="stCheck{{data.ID}}">
                <!-- <img src="data:image/png;base64,{{data.StudentPhoto}}"/> -->
                <img src="{{data.PhotoUrl}}" />
                <!-- <img src="assets/img/sample01.png"> -->

                <!-- <div class="card-body py-2 text-truncate">
                    {{data.Name}}<br> {{data.StudentNumber}}
                </div> -->
                <div class="card-body py-2 text-truncate">
                    <!-- <h5 class="mb-0 text-truncate">{{data.ChineseName}}({{data.Name}})</h5> -->
                    <h5 class="mb-0 text-truncate">{{data.ChineseName}}</h5>
                    <h5 class="mb-0 text-truncate">{{data.Name}}</h5>
                    <div class="text-gray text-truncate d-flex">{{data.StudentNumber}}
                      <!-- <span class="ml-auto">{{data.ClassName}}&nbsp;&nbsp;{{data.SeatNo}}</span> -->
                      <span class="ml-auto">#{{data.SeatNo}}</span>
                    </div>
                </div>
            </label>
        </div>
    </div>
</div>
