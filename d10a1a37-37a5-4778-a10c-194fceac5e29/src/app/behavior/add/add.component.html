<!-- 新增 -->
<div id="behavior-add">
    <nav aria-label="breadcrumb text-nowrap text-truncate">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <span class="point" [routerLink]="['/']">Home</span></li>
            <li class="breadcrumb-item">
                <span class="point" [routerLink]="['/behavior']">Behavior</span></li>
            <li class="breadcrumb-item active" aria-current="page">{{courseName}}</li>
            <button class="ml-auto btn btn-dark" [routerLink]="['/behavior/comment']">Comment Template</button>
        </ol>
    </nav>
    <div class="row">
        <div class="col-md-3 col-lg-2">
            <div class="form-group row">
                <label for="dateLabel" class="col-2 col-form-label">Date</label>
                <div class="col-10">
                    <input type="date" 
                            class="form-control" 
                            id="dateLabel" 
                            #currentDate [(ngModel)]="currentDateString"
                            (change)="currentDateChange(currentDate.value)">
                </div>
            </div>
        </div>
        <div class="input-group mb-3 col-md-6 col-lg-6">
            <div class="input-group-prepend">
                <button class="btn btn-outline-primary dropdown-toggle" 
                        type="button" 
                        data-toggle="dropdown"
                        aria-haspopup="true" 
                        aria-expanded="false">SELECT COMMENT</button>
                <div class="dropdown-menu">
                    <a class="dropdown-item" 
                        href="javascript:;" 
                        *ngFor="let data of commentTemplateList"
                        (click)="selectItem(data)">{{data.Comment}}</a>
                </div>
            </div>
            <input type="text" 
                    class="form-control" 
                    aria-label="Text input with dropdown button" 
                    placeholder="Comment…"
                [(ngModel)]="addText" (change)="commentChange()">
        </div>
        <div class="input-group col-md-3 col-lg-2 d-inline-flex">


   
        

                    <!--  -->

                    <div class="form-group form-check"    (click)="onCheckboxChange('detention')" style="margin-left: 5px">
                        <input id="detention"
                               type="checkbox"
                               class="form-check-input"
                               (change)="onCheckboxChange('detention')"
                               [(ngModel)]="currentDetention">
                        <label class="form-check-label"
                               for="detention">Detention</label>
                      </div>
                
                      <div class="form-group form-check"    (click)="onCheckboxChange('goodBehavior')"  style="margin-left: 5px">
                        <input id="goodBehavior"
                               type="checkbox"
                               class="form-check-input"
                            
                               [(ngModel)]="currentGood">
                        <label class="form-check-label"
                               for="goodBehavior">Good</label>
                      </div>    
                      
                      <div class="form-group form-check  "    (click)="onCheckboxChange('currentDaaDsaFollow')" style="margin-left: 5px">
                        <input id="currentDaaDsaFollow" 
                                type="checkbox" 
                                class="form-check-input" 
                             
                                [(ngModel)]="currentDaaDsaFollow">
                        <label class="form-check-label" for="currentDaaDsaFollow">DAA/DSA Follow up</label>
                  
                    </div>
                    <!--  -->

        </div>
        <div class="col-md-12 col-lg-2">
            <button class="ml-auto btn btn-info btn-block" 
                    disabled={{checkButtonEnable}} 
                    [routerLink]="['../list']"
                (click)="save()">SAVE （Checked : {{checkCount}}）</button>
        </div>
        
    </div>
    <div class="st-list d-flex flex-wrap mt-3 mt-lg-1">
        <div class="card st-check " 
            *ngFor="let data of studentDataList; let i = index">
            <input type="checkbox" 
                    id="stCheck{{data.ID}}" 
                    [(ngModel)]="data.checked" 
                    (change)="alert(data)">

            <label for="stCheck{{data.ID}}">
                <!-- <img src="data:image/png;base64,{{data.StudentPhoto}}"/> -->
                <img src="{{data.PhotoUrl}}" />
                <!-- <img src="assets/img/sample01.png"> -->

                <!-- <div class="card-body py-2 text-truncate">
                    {{data.Name}}<br> {{data.StudentNumber}}
                </div> -->
                <div class="card-body py-2 text-truncate">
                    <!-- <h5 class="mb-0 text-truncate">{{data.ChineseName}}({{data.Name}})</h5> -->
                    <h5 class="mb-0 text-truncate">{{data.ChineseName}}</h5>
                    <h5 class="mb-0 text-truncate">{{data.Name}}</h5>
                    <div class="text-gray text-truncate d-flex">{{data.StudentNumber}}
                      <!-- <span class="ml-auto">{{data.ClassName}}&nbsp;&nbsp;{{data.SeatNo}}</span> -->
                      <span class="ml-auto">{{data.SeatNo}}</span>
                    </div>
                </div>
            </label>
        </div>
    </div>
</div>
